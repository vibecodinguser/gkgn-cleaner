[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gkgn-cleaner"
version = "0.1.0"
description = "Конвертер документов из реестра ГКГН из PDF в XLSX с нормализацией"
requires-python = ">=3.12"
dependencies = [
    "docling",
    "docling-ibm-models",
    "onnxruntime",
    "pandas",
    "openpyxl",
    "rapidocr",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]
